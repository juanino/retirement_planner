name: Build Windows Binary

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd retirement_planner
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Windows executable
      run: |
        cd retirement_planner
        pyinstaller --onefile --name retirement_planner --console retirement_planner.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: retirement-planner-windows
        path: retirement_planner/dist/retirement_planner.exe
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: retirement_planner/dist/retirement_planner.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
